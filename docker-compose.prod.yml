# Runs TechPulse from images on Docker Hub. Needs this file and a .env next to it.
name: techpulse

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_USER: techpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: techpulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techpulse -d techpulse"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  ingest:
    image: tienmn1/techpulse-ingest:1.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://techpulse:${POSTGRES_PASSWORD}@postgres:5432/techpulse
      CONTACT_EMAIL: ${CONTACT_EMAIL:?set CONTACT_EMAIL in .env}
    mem_limit: 128m

  api:
    image: tienmn1/techpulse-api:1.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://techpulse:${POSTGRES_PASSWORD}@postgres:5432/techpulse
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      HF_HUB_OFFLINE: "1"
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8001"
    mem_limit: 2g

  # Keeps Chat and the summaries up to date with what ingest collects.
  indexer:
    image: tienmn1/techpulse-api:1.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        python -m rag.index init
        while true; do
          python -W ignore -m rag.index embed
          python -W ignore -m rag.index summarize
          sleep 300
        done
    environment:
      DATABASE_URL: postgresql://techpulse:${POSTGRES_PASSWORD}@postgres:5432/techpulse
    volumes:
      - ./models:/app/models:ro
      - huggingface:/opt/huggingface
    mem_limit: 3g

volumes:
  pgdata:
  huggingface:
