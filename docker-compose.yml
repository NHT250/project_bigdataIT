# Separate from realtime-wiki: own project name, network, volume and ports.
# Memory limits keep this stack small next to the Spark container.
name: techpulse

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_USER: techpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: techpulse
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techpulse -d techpulse"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  collector:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://techpulse:${POSTGRES_PASSWORD}@postgres:5432/techpulse
      CONTACT_EMAIL: ${CONTACT_EMAIL:?set CONTACT_EMAIL in .env}
    mem_limit: 128m

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql://techpulse:${POSTGRES_PASSWORD}@postgres:5432/techpulse
    mem_limit: 256m

volumes:
  pgdata:
